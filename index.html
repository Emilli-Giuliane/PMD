<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combine as cores!</title>
    <link rel="stylesheet" href="estilo/style.css">
</head>
<body>
    <main>
        <div class="tela1 active">
            <h1>Combine as <span id="coresTitulo">cores</span></h1>
            
            <img src="estilo/rainbowda.svg" alt="Arco-ires">

            <button id="startGame">Clique aqui para começar!</button>
        </div>

        <div class="tela2 tela">
            
            <button class="btnReset">Reiniciar</button>
            
            <div class="container">

                <div class="frasco"> 
                    <!-- <div class="ballY pos1 ball"></div> -->
                    <!-- <div class="ballY pos2 ball"></div> -->
                    <div class="ballLB pos2 ball"></div>
                    <div class="ballY pos3 ball"></div>
                    <div class="ballB pos4 ball"></div>
                </div>
                
                <div class="frasco">
                    <div class="ballY pos2 ball"></div>
                    <div class="ballB pos3 ball"></div>
                    <div class="ballLB pos4 ball"></div>
                </div>
                
                <div class="frasco">
                    <div class="ballB pos2 ball"></div>
                    <div class="ballY pos3 ball"></div>
                    <div class="ballLB pos4 ball"></div>
                </div>
                <div class="frasco">
                    <div class="ballLB pos2 ball"></div>
                    <div class="ballB pos3 ball"></div>
                    <div class="ballY pos4 ball"></div>
                </div>
                <div class="frasco">
                </div>
            </div>
        </div>

        <div class="tela3 tela">

            <button class="btnReset">Reiniciar</button>

            <div class="container">
                
                <div class="frasco">
                    <div class="ballY pos3 ball"></div>
                    <div class="ballR pos4 ball"></div>
                </div>
                
                <div class="frasco">
                    <div class="ballB pos3 ball"></div>
                    <div class="ballY pos4 ball"></div>
                </div>
                
                <div class="frasco">
                    <div class="ballLB pos3 ball"></div>
                    <div class="ballB pos4 ball"></div>

                </div>

                <div class="frasco">
                    <div class="ballY pos3 ball"></div>
                    <div class="ballLB pos4 ball"></div>
                </div>

                <div class="frasco">
                    <div class="ballB pos1 ball"></div>
                    <div class="ballY pos2 ball"></div>
                    <div class="ballR pos3 ball"></div>
                    <div class="ballR pos4 ball"></div>
                    
                </div>
                
                <div class="frasco">
                    <div class="ballB pos1 ball"></div>
                    <div class="ballLB pos2 ball"></div>
                    <div class="ballR pos3 ball"></div>
                    <div class="ballLB pos4 ball"></div>
                </div>

            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
